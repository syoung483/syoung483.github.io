<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能三 - 星火 X1 对话模型</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container { max-width: 980px; margin: 0 auto; padding: 20px; }
        .chat-card { background: rgba(255, 255, 255, 0.94); border-radius: 24px; padding: 20px; box-shadow: 0 24px 44px rgba(15, 25, 64, 0.18); border: 1px solid rgba(255,255,255,0.72); }
        .msg-list { max-height: 60vh; overflow: auto; padding: 10px; background: linear-gradient(180deg, #f7f9ff, #fdfdff); border: 1px solid #e7ebff; border-radius: 18px; }
        .msg { display:flex; flex-direction: column; gap: 6px; margin: 12px 0; }
        .bubble { max-width: 80%; padding: 13px 15px; border-radius: 18px; line-height: 1.72; word-break: break-word; white-space: pre-wrap; box-shadow: 0 10px 24px rgba(20, 32, 74, 0.08); }
        .user { align-items: flex-end; }
        .user .bubble { background: linear-gradient(135deg, #dfe8ff, #ebf8ff); border: 1px solid #cfe2ff; border-bottom-right-radius: 6px; color: #18233f; }
        .assistant { align-items: flex-start; }
        .assistant .bubble { background: #ffffff; border: 1px solid #e8ebf5; border-bottom-left-radius: 6px; color: #18233f; }
        .reasoning { max-width: 80%; font-size: 13px; color: #58637d; background: rgba(255,255,255,0.86); border-left: 3px solid #5d9dff; padding: 8px 11px; border-radius: 10px; }
        .input-row { display: flex; gap: 10px; margin-top: 12px; }
        .input-row input { flex: 1; padding: 14px 16px; border-radius: 18px; border: 1px solid #d8def5; outline: none; background: #fbfcff; color: #172036; box-shadow: inset 0 1px 2px rgba(17,28,68,0.04); }
        .input-row input:focus { border-color: #8ba2ff; box-shadow: 0 0 0 4px rgba(102,126,234,0.12); }
        .btn { padding: 10px 18px; border: none; border-radius: 16px; cursor: pointer; color: white; background: linear-gradient(135deg, #5b73ff, #48c6ef); }
        .btn:disabled { background: #94a0b8; cursor: not-allowed; box-shadow: none; }
        .top-actions { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
        .small { font-size: 12px; color:#64708b; }
        #statusText { display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px; border-radius: 999px; background: #f2f5ff; border: 1px solid #dde4ff; }

        @media (max-width: 768px) {
            .chat-container {
                padding: 10px 0 18px;
            }

            .chat-container h1 {
                font-size: 1.55rem;
                line-height: 1.3;
            }

            .subtitle {
                font-size: 1rem;
                margin-bottom: 18px;
            }

            .chat-card {
                padding: 14px;
                border-radius: 14px;
            }

            .top-actions {
                flex-wrap: wrap;
                align-items: flex-start;
            }

            .msg-list {
                max-height: 52vh;
                padding: 4px 0;
            }

            .bubble,
            .reasoning {
                max-width: 92%;
            }

            .input-row {
                flex-direction: column;
            }

            .input-row input,
            .input-row .btn,
            .chat-container > .back-btn,
            .top-actions .btn {
                width: 100%;
                min-height: 44px;
            }
        }

        @media (max-width: 480px) {
            .chat-card {
                padding: 12px;
            }

            .chat-container h1 {
                font-size: 1.35rem;
            }

            .bubble {
                padding: 10px 12px;
                font-size: 14px;
                line-height: 1.6;
            }

            .reasoning,
            .small {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
<div id="container">
    <div class="chat-container">
        <button class="back-btn" onclick="window.location.href='home.html'">← 返回首页</button>
        <h1>🤖 星火 X1 对话模型</h1>
        <p class="subtitle">基于 WebSocket 的流式对话 Demo（功能三）</p>

        <div class="chat-card">
            <div class="top-actions">
                <button class="btn" id="connectBtn" onclick="ensureConnected()">连接模型</button>
                <span id="statusText" class="small">未连接</span>
            </div>
            <div id="msgList" class="msg-list"></div>
            <div class="input-row">
                <input id="userInput" placeholder="输入你的问题，如：推荐两个适合自驾春游的景点" />
                <button class="btn" id="sendBtn" onclick="sendMsg()" disabled>发送</button>
            </div>
            <div class="small" style="margin-top:8px;">提示：发送消息时会自动连接；服务端在一轮对话结束后可能主动断开，下一次发送会自动重连。</div>
        </div>
    </div>
</div>

<script src="frontend-config.js"></script>
<script>
let ws = null;
let appId = '';
let sparkModelId = '';
let connected = false;
let connecting = false;
let pendingToSend = null; // 等待连接后发送的消息
let currentAssistantEl = null; // 当前聚合显示的AI答案元素（气泡）
let currentReasoningEl = null; // 当前推理内容元素（位于答案上方）

function getBackendBase(){
    return getConfiguredBackendBaseUrl();
}
function createMsg(role, text){
    const list = document.getElementById('msgList');
    const line = document.createElement('div');
    line.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text || '';
    line.appendChild(bubble);
    list.appendChild(line);
    list.scrollTop = list.scrollHeight;
    return bubble;
}

function appendUser(text){
    createMsg('user', text);
}

function beginAssistant(){
    currentAssistantEl = createMsg('assistant', '');
    currentReasoningEl = null;
}

function appendAssistantChunk(content){
    if (!currentAssistantEl) beginAssistant();
    currentAssistantEl.textContent += content;
    const list = document.getElementById('msgList');
    list.scrollTop = list.scrollHeight;
}

function appendReasoningChunk(content){
    if (!currentAssistantEl) beginAssistant();
    if (!currentReasoningEl){
        currentReasoningEl = document.createElement('div');
        currentReasoningEl.className = 'reasoning';
        currentReasoningEl.textContent = '';
        // 推理放在答案上方：插入到气泡之前
        const parent = currentAssistantEl.parentElement;
        parent.insertBefore(currentReasoningEl, currentAssistantEl);
    }
    currentReasoningEl.textContent += content;
}

function resetConnectionState(statusText){
    connected = false;
    connecting = false;
    ws = null;
    document.getElementById('sendBtn').disabled = false;
    if (statusText) setStatus(statusText);
}
async function ensureConnected(){
    if (connected || connecting) return;
    setStatus('正在获取签名...');
    connecting = true;
    try {
        const backendBase = getBackendBase();
        if (!backendBase) {
            throw new Error('未配置后端地址，请在 frontend-config.js 中填写公网后端地址');
        }

        const resp = await fetch(`${backendBase}/api/spark-x1/sign`);
        if (!resp.ok) throw new Error(`签名接口请求失败: HTTP ${resp.status}`);
        const data = await resp.json();
        if (!data.success) throw new Error(data.message || '签名失败');
        const url = data.url;
        appId = data.appId;
        sparkModelId = data.modelId || 'x1';
        setStatus('正在建立连接...');
        ws = new WebSocket(url);
        ws.onopen = () => {
            connected = true; connecting = false;
            setStatus('已连接');
            document.getElementById('sendBtn').disabled = false;
            if (pendingToSend){ const tmp = pendingToSend; pendingToSend = null; _send(tmp); }
        };
        ws.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);
                if (payload?.header?.code && payload.header.code !== 0) { setStatus('错误: ' + payload.header.message); return; }
                const choices = payload?.payload?.choices;
                if (choices?.text && choices.text.length > 0) {
                    const item = choices.text[0];
                    if (item.reasoning_content) appendReasoningChunk(item.reasoning_content);
                    if (item.content) appendAssistantChunk(item.content);
                    if (choices.status === 2){
                        currentAssistantEl = null; currentReasoningEl = null;
                    }
                }
            } catch (e) { console.error('解析消息失败:', e, event.data); }
        };
        ws.onclose = (event) => {
            if (event.code === 1000) {
                resetConnectionState('本轮连接已结束，下次发送将自动重连');
                return;
            }
            resetConnectionState(`已断开 (${event.code}${event.reason ? ': ' + event.reason : ''})`);
        };
        ws.onerror = (e) => {
            console.error(e);
            resetConnectionState('连接出错，请检查控制台或接口配置');
        };
    } catch (e) {
        console.error(e);
        connecting = false;
        setStatus('签名或连接失败: ' + e.message);
    }
}

function setStatus(text){ document.getElementById('statusText').innerText = text; }

function sendMsg(){
    const input = document.getElementById('userInput');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    appendUser(content);
    beginAssistant();
    if (!connected){ pendingToSend = content; ensureConnected(); return; }
    _send(content);
}

function _send(content){
    if (!ws) return;
    const body = {
        header: { uid: 'demo_user', app_id: appId },
        payload: { message: { text: [{ role: 'user', content }] } },
        parameter: { chat: { domain: sparkModelId || 'x1', max_tokens: 2048, temperature: 0.5, top_k: 4 } }
    };
    try { ws.send(JSON.stringify(body)); } catch(e){ console.error(e); setStatus('发送失败: ' + e.message); }
}

window.addEventListener('DOMContentLoaded', () => {
    setStatus(getBackendBase() ? '待连接' : '未配置后端地址，请在 frontend-config.js 中填写 backendBaseUrl');
    document.getElementById('sendBtn').disabled = false;
});
</script>
</body>
</html>
