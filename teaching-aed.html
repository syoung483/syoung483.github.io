<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AED 使用教学</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .teach-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(300px, 26vw, 380px);
            gap: 22px;
            padding: 16px;
            min-height: calc(100vh - 40px);
            align-items: stretch;
        }
        .left {
            position: relative;
            min-width: 0;
        }
        .right {
            width: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel {
            background: rgba(255,255,255,0.94);
            border: 1px solid rgba(255,255,255,0.72);
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 18px 32px rgba(17,28,68,.14);
        }
        .steps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .step-btn {
            padding: 12px 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #5b73ff, #48c6ef);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 18px rgba(91, 115, 255, 0.18);
        }
        .step-btn.error { background: linear-gradient(135deg, #ff6b6b, #ff8e53); }
        .top-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: #fff;
            padding: 0 4px;
            flex-wrap: wrap;
        }
        .top-actions strong {
            font-size: 1.2rem;
            letter-spacing: 0.01em;
        }
        .back-btn { margin-bottom: 0; }
        #loading { position:absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,.92); padding: 12px 16px; border-radius: 14px; display:none; color: #1a2540; box-shadow: 0 18px 32px rgba(17,28,68,.16); }
        #threeRef {
            width: 100%;
            height: calc(100vh - 72px);
            min-height: 520px;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.16);
            box-shadow: 0 22px 40px rgba(0,0,0,.18);
        }
        .tip {
            margin-top: 10px;
            font-size: 12px;
            color: #65708b;
            line-height: 1.5;
        }
        @media (max-width: 1100px) {
            .teach-container {
                grid-template-columns: minmax(0, 1fr) 320px;
            }
        }
        @media (max-width: 900px) {
            .teach-container {
                grid-template-columns: 1fr;
            }
            #threeRef {
                height: 52vh;
                min-height: 360px;
            }
        }
        @media (max-width: 640px) {
            .teach-container {
                padding: 12px;
                gap: 14px;
            }
            .top-actions {
                align-items: flex-start;
                gap: 8px;
            }
            .top-actions strong {
                width: 100%;
                font-size: 1.05rem;
            }
            .panel {
                padding: 12px;
            }
            .steps {
                grid-template-columns: 1fr;
            }
            .step-btn {
                padding: 12px 10px;
                font-size: 0.95rem;
            }
            #threeRef {
                height: 46vh;
                min-height: 280px;
            }
            .tip {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
<div id="container">
    <div class="teach-container">
        <div class="left">
            <div id="threeRef"></div>
            <div class="loading" id="loading">正在加载模型...</div>
        </div>
        <div class="right">
            <div class="top-actions">
                <button class="back-btn" onclick="window.location.href='usage-select.html'">← 返回选择</button>
                <strong>AED 使用教学</strong>
            </div>
            <div class="panel">
                <h3>步骤触发</h3>
                <div class="steps">
                    <button class="step-btn" onclick="playStep(1)">1 开机</button>
                    <button class="step-btn" onclick="playStep(2)">2 贴片</button>
                    <button class="step-btn" onclick="playStep(3)">3 分析</button>
                    <button class="step-btn" onclick="playStep(4)">4 放电</button>
                    <button class="step-btn" onclick="playStep(5)">5 心肺+呼吸</button>
                    <button class="step-btn error" onclick="playStep('错误 放电接触患者')">错误 放电接触患者</button>
                    <button class="step-btn error" onclick="playStep('错误 分析时触碰贴片')">错误 分析时触碰贴片</button>
                    <button class="step-btn error" onclick="playStep('错误贴片')">错误 贴片</button>
                </div>
                <div class="tip">提示：每个按钮会加载对应 glb 并替换当前场景，加载方式与 `models/aed.glb` 一致。</div>
            </div>
        </div>
    </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<script src="teaching-aed.js"></script>
</body>
</html>
