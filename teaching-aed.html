<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AED 使用教学</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .teach-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(280px, 24vw, 360px);
            gap: 20px;
            padding: 16px;
            min-height: calc(100vh - 40px);
            align-items: stretch;
        }
        .left {
            position: relative;
            min-width: 0;
        }
        .right {
            width: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,.06);
        }
        .steps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .step-btn {
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #28a745;
            color: #fff;
            cursor: pointer;
        }
        .step-btn.error { background:#dc3545; }
        .top-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: #fff;
            padding: 0 4px;
            flex-wrap: wrap;
        }
        .back-btn { background:#6c757d; color:#fff; border:none; padding:8px 14px; border-radius:16px; cursor:pointer; }
        #loading { position:absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,.9); padding: 12px 16px; border-radius: 10px; display:none; }
        #threeRef {
            width: 100%;
            height: calc(100vh - 72px);
            min-height: 520px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,.08);
            box-shadow: 0 10px 28px rgba(0,0,0,.18);
        }
        .tip {
            margin-top: 10px;
            font-size: 12px;
            color: #6c757d;
            line-height: 1.5;
        }
        @media (max-width: 1100px) {
            .teach-container {
                grid-template-columns: minmax(0, 1fr) 320px;
            }
        }
        @media (max-width: 900px) {
            .teach-container {
                grid-template-columns: 1fr;
            }
            #threeRef {
                height: 52vh;
                min-height: 360px;
            }
        }
        @media (max-width: 640px) {
            .teach-container {
                padding: 12px;
                gap: 14px;
            }
            .top-actions {
                align-items: flex-start;
                gap: 8px;
            }
            .top-actions strong {
                width: 100%;
                font-size: 1.05rem;
            }
            .panel {
                padding: 12px;
            }
            .steps {
                grid-template-columns: 1fr;
            }
            .step-btn {
                padding: 12px 10px;
                font-size: 0.95rem;
            }
            #threeRef {
                height: 46vh;
                min-height: 280px;
            }
            .tip {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
<div id="container">
    <div class="teach-container">
        <div class="left">
            <div id="threeRef"></div>
            <div class="loading" id="loading">正在加载模型...</div>
        </div>
        <div class="right">
            <div class="top-actions">
                <button class="back-btn" onclick="window.location.href='usage-select.html'">← 返回选择</button>
                <strong>AED 使用教学</strong>
            </div>
            <div class="panel">
                <h3>步骤触发</h3>
                <div class="steps">
                    <button class="step-btn" onclick="playStep(1)">1 开机</button>
                    <button class="step-btn" onclick="playStep(2)">2 贴片</button>
                    <button class="step-btn" onclick="playStep(3)">3 分析</button>
                    <button class="step-btn" onclick="playStep(4)">4 放电</button>
                    <button class="step-btn" onclick="playStep(5)">5 心肺+呼吸</button>
                    <button class="step-btn error" onclick="playStep('错误 放电接触患者')">错误 放电接触患者</button>
                    <button class="step-btn error" onclick="playStep('错误 分析时触碰贴片')">错误 分析时触碰贴片</button>
                    <button class="step-btn error" onclick="playStep('错误贴片')">错误 贴片</button>
                </div>
                <div class="tip">提示：每个按钮会加载对应 glb 并替换当前场景，加载方式与 `models/aed.glb` 一致。</div>
            </div>
        </div>
    </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<script src="teaching-aed.js"></script>
</body>
</html>
