<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AED 使用教学</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-header {
            max-width: 1180px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 20px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.62));
            border: 1px solid rgba(255,255,255,0.86);
            box-shadow: 0 16px 30px rgba(88, 104, 163, 0.12);
            backdrop-filter: blur(18px);
        }
        .page-header-text {
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #1b2540;
        }
        .page-header-badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(91, 115, 255, 0.1);
            color: #4560d3;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .page-header h1 {
            font-size: 1.7rem;
            line-height: 1.2;
            color: #1b2540;
        }
        .page-header p {
            color: #63708d;
            line-height: 1.7;
            font-size: 0.98rem;
        }
        .teach-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(300px, 26vw, 380px);
            gap: 22px;
            padding: 8px 16px 16px;
            min-height: calc(100vh - 40px);
            align-items: stretch;
            max-width: 1180px;
            margin: 0 auto;
        }
        .left {
            position: relative;
            min-width: 0;
        }
        .right {
            width: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel {
            background: rgba(255,255,255,0.94);
            border: 1px solid rgba(255,255,255,0.72);
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 18px 32px rgba(17,28,68,.14);
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .steps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mobile-toggle {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 11px 12px;
            border: none;
            border-radius: 14px;
            background: rgba(91, 115, 255, 0.12);
            color: #3550c8;
            font-weight: 700;
            cursor: pointer;
        }
        .step-btn {
            padding: 12px 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #5b73ff, #48c6ef);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 18px rgba(91, 115, 255, 0.18);
        }
        .step-btn.error { background: linear-gradient(135deg, #ff6b6b, #ff8e53); }
        .back-btn { margin-bottom: 0; }
        #loading { position:absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,.92); padding: 12px 16px; border-radius: 14px; display:none; color: #1a2540; box-shadow: 0 18px 32px rgba(17,28,68,.16); }
        #threeRef {
            width: 100%;
            height: calc(100vh - 72px);
            min-height: 520px;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.16);
            box-shadow: 0 22px 40px rgba(0,0,0,.18);
        }
        .tip {
            margin-top: 10px;
            font-size: 12px;
            color: #65708b;
            line-height: 1.5;
        }
        .panel h3 {
            margin-bottom: 0;
            color: #202b4d;
            font-size: 1.3rem;
        }
        @media (max-width: 1100px) {
            .teach-container {
                grid-template-columns: minmax(0, 1fr) 320px;
            }
        }
        @media (max-width: 900px) {
            .teach-container {
                grid-template-columns: 1fr;
            }
            #threeRef {
                height: 52vh;
                min-height: 360px;
            }
        }
        @media (max-width: 640px) {
            .page-header {
                padding: calc(12px + env(safe-area-inset-top)) 14px 14px;
                margin-bottom: 10px;
                border-radius: 20px;
                flex-direction: column;
                align-items: flex-start;
            }
            .page-header h1 {
                font-size: 1.22rem;
            }
            .page-header p {
                font-size: 0.9rem;
                line-height: 1.6;
            }
            .teach-container {
                padding: 0 10px calc(18px + env(safe-area-inset-bottom));
                gap: 12px;
            }
            .right {
                gap: 10px;
            }
            .panel {
                padding: 12px;
                border-radius: 18px;
            }
            .panel h3 {
                font-size: 1.16rem;
            }
            .panel-header {
                align-items: flex-start;
                flex-direction: column;
                margin-bottom: 12px;
            }
            .steps {
                grid-template-columns: 1fr;
            }
            .panel.mobile-collapsed .steps .step-btn:nth-child(n + 4) {
                display: none;
            }
            .mobile-toggle {
                display: block;
            }
            .step-btn {
                padding: 11px 10px;
                font-size: 0.95rem;
            }
            #threeRef {
                height: clamp(220px, 34vh, 300px);
                min-height: 220px;
                border-radius: 20px;
            }
            #loading {
                max-width: calc(100% - 32px);
                text-align: center;
            }
            .tip {
                font-size: 11px;
            }
        }
        @media (max-width: 480px) {
            .teach-container {
                padding: 0 8px calc(16px + env(safe-area-inset-bottom));
            }
            .page-header {
                padding: calc(10px + env(safe-area-inset-top)) 12px 12px;
            }
            .page-header h1 {
                font-size: 1.12rem;
            }
            #threeRef {
                height: clamp(200px, 31vh, 260px);
                min-height: 200px;
            }
            .step-btn {
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>
<div id="container">
    <div class="page-header">
        <div class="page-header-text">
            <span class="page-header-badge">AED 教学模式</span>
            <h1>AED 使用教学</h1>
            <p>通过步骤切换查看 AED 在不同教学阶段的模型状态，适合手机端快速浏览与演示。</p>
        </div>
    </div>
    <div class="teach-container">
        <div class="left">
            <div id="threeRef"></div>
            <div class="loading" id="loading">正在加载模型...</div>
        </div>
        <div class="right">
            <div class="panel mobile-collapsed" id="stepPanel">
                <div class="panel-header">
                    <h3>步骤触发</h3>
                    <button class="back-btn" onclick="window.location.href='usage-select.html'">← 退出教学</button>
                </div>
                <div class="steps">
                    <button class="step-btn" onclick="playStep(1)">1 开机</button>
                    <button class="step-btn" onclick="playStep(2)">2 贴片</button>
                    <button class="step-btn" onclick="playStep(3)">3 分析</button>
                    <button class="step-btn" onclick="playStep(4)">4 放电</button>
                    <button class="step-btn" onclick="playStep(5)">5 心肺+呼吸</button>
                    <button class="step-btn error" onclick="playStep('错误 放电接触患者')">错误 放电接触患者</button>
                    <button class="step-btn error" onclick="playStep('错误 分析时触碰贴片')">错误 分析时触碰贴片</button>
                    <button class="step-btn error" onclick="playStep('错误贴片')">错误 贴片</button>
                </div>
                <button class="mobile-toggle" id="mobileToggleBtn" onclick="toggleMobileSteps()">展开全部步骤</button>
                <div class="tip">提示：每个按钮会加载对应 glb 并替换当前场景，加载方式与 `models/aed.glb` 一致。</div>
            </div>
        </div>
    </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<script src="teaching-aed.js"></script>
<script>
    function syncMobileStepState() {
        const panel = document.getElementById('stepPanel');
        const toggleBtn = document.getElementById('mobileToggleBtn');
        if (!panel || !toggleBtn) return;

        if (window.innerWidth > 640) {
            panel.classList.remove('mobile-collapsed');
            toggleBtn.textContent = '展开全部步骤';
            return;
        }

        if (!panel.classList.contains('mobile-collapsed')) {
            toggleBtn.textContent = '收起步骤';
        } else {
            toggleBtn.textContent = '展开全部步骤';
        }
    }

    function toggleMobileSteps() {
        const panel = document.getElementById('stepPanel');
        const toggleBtn = document.getElementById('mobileToggleBtn');
        if (!panel || !toggleBtn || window.innerWidth > 640) return;

        panel.classList.toggle('mobile-collapsed');
        toggleBtn.textContent = panel.classList.contains('mobile-collapsed') ? '展开全部步骤' : '收起步骤';
    }

    window.addEventListener('resize', syncMobileStepState);
    window.addEventListener('DOMContentLoaded', syncMobileStepState);
</script>
</body>
</html>
