<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D模型展示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="viewer-page">
    <div id="container">
        <div id="threeRef"></div>
        <button class="btn back-btn viewer-mobile-exit" onclick="goBackTarget()">退出查看</button>
        <div class="viewer-toolbar">
            <button class="btn viewer-tool-btn" onclick="resetViewerCamera()">重置视角</button>
            <button class="btn viewer-tool-btn" onclick="toggleViewerFullscreen()">全屏查看</button>
        </div>
        <div id="info">
            <h1 id="modelTitle">3D模型展示</h1>
            <div class="viewer-meta">
                <span>多模型入口</span>
                <span>支持动画</span>
                <span>移动端可交互</span>
            </div>
            <p>手机端可单指旋转、双指缩放，首次加载可能需要 10 到 30 秒</p>
            <div class="controls">
                <div class="control-group-title">模型控制</div>
                <button onclick="toggleAnimation()" class="btn">⏯️ 暂停/播放动画</button>
                <button onclick="changeSpeed(0.5)" class="btn">🐌 慢速</button>
                <button onclick="changeSpeed(1.0)" class="btn">▶️ 正常</button>
                <button onclick="changeSpeed(2.0)" class="btn">⚡ 快速</button>
                <div class="control-group-title">页面导航</div>
                <button id="backBtn" onclick="goBackTarget()" class="btn back-btn">🏠 返回设备列表</button>
            </div>
            <p class="viewer-note">可以从模型展示页或教学页进入，当前页面会根据来源自动返回到对应入口。</p>
        </div>
        <div class="loading" id="loading">正在加载模型资源...</div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <script src="model-viewer-universal.js"></script>
    <script>
        function getBackTarget() {
            const params = new URLSearchParams(window.location.search);
            return params.get('back') || 'model-select.html';
        }

        function goBackTarget() {
            window.location.href = getBackTarget();
        }

        function resetViewerCamera() {
            if (typeof fitCameraToModel === 'function') {
                fitCameraToModel();
            }
        }

        async function toggleViewerFullscreen() {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
                return;
            }
            await document.exitFullscreen();
        }
    </script>
</body>
</html>
