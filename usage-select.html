<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用教学 - 仪器选择</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .select-container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px;
            color: white;
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 28px;
            backdrop-filter: blur(18px);
            box-shadow: 0 24px 48px rgba(7, 15, 40, 0.24);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        .card {
            background: rgba(255,255,255,0.94);
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 22px;
            padding: 20px 18px;
            box-shadow: 0 16px 28px rgba(17, 28, 68, 0.12);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            min-height: 210px;
            transition: transform .22s ease, box-shadow .22s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 34px rgba(17, 28, 68, 0.18);
        }
        .card h3 {
            margin: 12px 0 8px;
            color: #1b2540;
            text-align: center;
        }
        .card .thumb {
            width: 76px;
            height: 76px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            font-size: 40px;
            background: linear-gradient(135deg, #eef2ff, #e3f6ff);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
        }
        .card .btn {
            margin-top: 14px;
            width: 100%;
        }
        .disabled {
            opacity: .5;
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .select-container {
                padding: 18px 14px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 12px;
            }
            .card {
                padding: 16px 14px;
                min-height: 184px;
            }
            .card .thumb {
                width: 68px;
                height: 68px;
                font-size: 34px;
            }
            .card h3 {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .select-container {
                padding: 10px;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .card {
                padding: 15px;
                min-height: 176px;
            }
            .card .thumb {
                width: 62px;
                height: 62px;
                font-size: 30px;
            }
            .card h3 {
                font-size: 0.9rem;
            }
        }
    </style>
    
</head>
<body>
    <div id="container">
        <div class="select-container">
            <button class="back-btn" onclick="window.location.href='home.html'">← 返回首页</button>
            <h1>🎓 使用教学 - 选择仪器</h1>
            <p class="subtitle">请选择需要学习的仪器模型</p>
            <div class="grid">
                <div class="card">
                    <div class="thumb">🏥</div>
                    <h3>AED 除颤仪</h3>
                    <button class="btn" onclick="window.location.href='teaching-aed.html'">进入教学</button>
                </div>
                <div class="card">
                    <div class="thumb">🧯</div>
                    <h3>灭火器</h3>
                    <button class="btn" onclick="window.location.href='teaching-video.html?device=灭火器'">进入教学</button>
                </div>
                <div class="card">
                    <div class="thumb">🚨</div>
                    <h3>场外报警设备</h3>
                    <button class="btn" onclick="window.location.href='teaching-video.html?device=场外报警2'">进入教学</button>
                </div>
                <div class="card">
                    <div class="thumb">🏠</div>
                    <h3>宿舍模型</h3>
                    <button class="btn" onclick="window.location.href='teaching-video.html?device=宿舍'">进入教学</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
