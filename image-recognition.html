<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应急安全教育平台 - 图片识别</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .recognition-container {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .upload-section {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.72);
            box-shadow: 0 24px 44px rgba(15, 25, 64, 0.18);
        }
        
        .upload-area {
            border: 2px dashed #7f95ff;
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(180deg, #f7f9ff, #eef4ff);
        }
        
        .upload-area.hidden {
            display: none;
        }
        
        .upload-area:hover {
            border-color: #5c78ff;
            background: linear-gradient(180deg, #f9fbff, #e9f0ff);
            transform: translateY(-2px);
        }
        
        .upload-area.dragover {
            border-color: #48c6ef;
            background: linear-gradient(180deg, #f5fdff, #e8fbff);
        }
        
        .file-input {
            display: none;
        }
        
        .upload-icon {
            font-size: 52px;
            color: #5c78ff;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #5c6783;
            margin-bottom: 20px;
            line-height: 1.75;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: block;
        }
        
        /* 新增：图片和结果的并排显示样式 */
        .image-results-container {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .image-side {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }
        
        .preview-image-side {
            max-width: 100%;
            max-height: 350px;
            border-radius: 16px;
            box-shadow: 0 18px 30px rgba(17, 28, 68, 0.12);
            margin-bottom: 15px;
        }
        
        .result-section {
            flex: 1;
            min-width: 300px;
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            padding: 25px;
            margin: 0;
            box-shadow: 0 18px 30px rgba(17, 28, 68, 0.12);
            border: 1px solid #edf1ff;
        }
        
        .recognition-btn {
            background: linear-gradient(135deg, #5b73ff, #48c6ef);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 16px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 12px 20px rgba(91, 115, 255, 0.24);
        }
        
        .recognition-btn:hover {
            transform: translateY(-2px);
        }
        
        .recognition-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }
        
        .recognition-btn:disabled:hover {
            background: #6c757d;
            transform: none;
        }
        
        .result-section h3 {
            color: #2a3b8f;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }
        
        .result-item {
            background: linear-gradient(180deg, #f8faff, #ffffff);
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #5c78ff;
            box-shadow: 0 10px 24px rgba(17,28,68,0.06);
        }
        
        .result-name {
            font-weight: bold;
            color: #212529;
            margin-bottom: 5px;
        }
        
        .result-score {
            color: #6c757d;
            font-size: 14px;
        }
        
        /* 描述文字容器样式 */
        .description-container {
            margin: 10px 0;
        }
        
        .description-text {
            color: #495057;
            line-height: 1.6;
            max-height: 80px;
            overflow: hidden;
            transition: max-height 0.3s ease;
            word-wrap: break-word;
        }
        
        .description-text.expanded {
            max-height: none;
            overflow: visible;
        }
        
        .expand-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        
        .expand-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #5c6783;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.72);
            box-shadow: 0 18px 30px rgba(17, 28, 68, 0.12);
        }
        
        .spinner {
            border: 4px solid #eef1ff;
            border-top: 4px solid #5c78ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: rgba(255, 240, 243, 0.96);
            color: #8a2234;
            padding: 20px;
            border-radius: 18px;
            margin: 20px 0;
            border: 1px solid #ffd0d7;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 12px 24px rgba(139, 34, 52, 0.08);
        }
        
        .back-btn {
            margin-bottom: 20px;
        }
        
        .back-btn:hover {
            background: #5a6268;
        }

        @media (max-width: 900px) {
            .recognition-container {
                padding: 16px;
            }

            .upload-section {
                padding: 22px;
            }

            .image-results-container {
                gap: 20px;
            }

            .image-side,
            .result-section {
                min-width: 100%;
            }
        }

        @media (max-width: 640px) {
            .recognition-container {
                padding: 10px 0 20px;
            }

            .recognition-container h1 {
                font-size: 1.55rem;
                line-height: 1.3;
            }

            .subtitle {
                font-size: 1rem;
                margin-bottom: 18px;
            }

            .upload-section {
                padding: 16px 12px;
                border-radius: 14px;
                margin-bottom: 20px;
            }

            .upload-area {
                padding: 28px 14px;
                margin: 16px 0;
            }

            .upload-icon {
                font-size: 40px;
            }

            .upload-text {
                font-size: 0.95rem;
                line-height: 1.6;
            }

            .image-results-container {
                flex-direction: column;
                gap: 14px;
                margin: 14px 0;
            }

            .image-side,
            .result-section {
                min-width: 0;
                width: 100%;
            }

            .preview-image,
            .preview-image-side {
                max-height: 240px;
                margin: 12px auto;
            }

            .result-section {
                padding: 16px 14px;
            }

            .result-section h3 {
                font-size: 18px;
                margin-bottom: 14px;
            }

            .result-item {
                padding: 14px;
                margin: 10px 0;
            }

            .recognition-btn,
            .back-btn {
                width: 100%;
                margin: 8px 0;
                min-height: 44px;
                font-size: 15px;
            }

            #recognizeBtn {
                margin-top: 14px !important;
            }

            .loading {
                padding: 20px 12px;
            }

            .spinner {
                width: 40px;
                height: 40px;
                margin-bottom: 14px;
            }

            .error-message {
                padding: 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="recognition-container">
            <button class="back-btn" onclick="window.location.href='home.html'">← 返回首页</button>
            
            <h1>📸 应急设备图片识别</h1>
            <p class="subtitle">上传照片，智能识别应急设备类型</p>
            
            <div class="upload-section">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">
                        <strong>点击选择图片</strong><br>
                        或拖拽图片到此处
                    </div>
                    <input type="file" id="fileInput" class="file-input" accept="image/*">
                </div>
                
                <div id="imagePreview" style="display: none;">
                    <img id="previewImg" class="preview-image" alt="预览图片">
                    <br>
                    <button class="recognition-btn" onclick="resetImageSelection()" style="background: #6c757d; margin: 10px;">
                        🔄 重新选择图片
                    </button>
                </div>
                
                <!-- 创建图片和结果的并排显示容器 -->
                <div id="imageAndResultsContainer" class="image-results-container" style="display: none;">
                    <div class="image-side">
                        <img id="previewImgSide" class="preview-image-side" alt="预览图片">
                        <br>
                        <button class="recognition-btn" onclick="resetImageSelection()" style="background: #6c757d; margin: 10px;">
                            🔄 重新选择图片
                        </button>
                    </div>
                    
                    <div id="resultSection" class="result-section">
                        <h3>🎯 识别结果</h3>
                        <div id="resultContent"></div>
                    </div>
                </div>
                
                <!-- 将识别按钮移到这里，使其始终可见 -->
                <button class="recognition-btn" id="recognizeBtn" onclick="recognizeImage()" style="margin-top: 20px;">
                    🔍 开始识别
                </button>
            </div>
            
            <div id="loadingSection" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在识别中，请稍候...</p>
            </div>
            
            <div id="errorSection" style="display: none;"></div>
        </div>
    </div>

    <script src="frontend-config.js"></script>
    <script src="image-recognition.js"></script>
</body>
</html>
