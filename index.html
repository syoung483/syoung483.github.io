<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应急安全教育平台 - 首页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div class="home-content">
            <div class="hero-badge">智慧应急 · 可视化教学平台</div>
            <h1>🚨 应急安全教育平台</h1>
            <h2 class="subtitle">把设备认知、模型交互、图像识别与智能问答整合在一个学习入口</h2>
            <p class="hero-description">面向 AED、灭火器、场外报警设备与宿舍安全场景，提供 3D 模型展示、图片识别、对话讲解和使用教学，帮助用户更直观地理解应急设备与操作流程。</p>
            <div class="hero-highlights">
                <span class="highlight-chip">3D 模型交互展示</span>
                <span class="highlight-chip">应急设备图像识别</span>
                <span class="highlight-chip">星火模型智能问答</span>
                <span class="highlight-chip">移动端友好体验</span>
            </div>
            <div class="module-buttons">
                <button class="module-btn" onclick="window.location.href='model-select.html'">
                    <span class="module-icon">📦</span>
                    <span class="module-title">模型展示</span>
                    <span class="module-desc">四类设备与场景模型统一入口，支持旋转、缩放和动画查看。</span>
                </button>
                <button class="module-btn" onclick="window.location.href='image-recognition.html'">
                    <span class="module-icon">📸</span>
                    <span class="module-title">图片识别</span>
                    <span class="module-desc">上传设备照片，快速识别类型并跳转对应的模型展示页面。</span>
                </button>

                <button class="module-btn" onclick="window.location.href='chat-x1.html'">
                    <span class="module-icon">🧠</span>
                    <span class="module-title">对话模型</span>
                    <span class="module-desc">通过星火模型进行应急知识问答，支持流式返回与连续提问。</span>
                </button>
                <button class="module-btn" onclick="window.location.href='usage-select.html'">
                    <span class="module-icon">🎓</span>
                    <span class="module-title">使用教学</span>
                    <span class="module-desc">结合模型与步骤按钮，演示 AED 等设备的关键操作流程。</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function showComingSoon() {
            alert('此功能正在开发中，敬请期待！');
        }
    </script>
</body>
</html>
